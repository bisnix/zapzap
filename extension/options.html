<!doctype html>
<html lang="id"><head><meta charset="UTF-8"/><title>Zapzap setup</title><style>body{max-width:560px;margin:50px auto;padding:0 24px;background:#f3f0e8;color:#101719;font:15px Arial,sans-serif}input{display:block;width:100%;padding:12px;margin:8px 0 16px;border:1px solid #ccc;border-radius:7px}button{padding:11px 16px;border:0;border-radius:7px;background:#101719;color:#fff;font-weight:bold}.help{color:#68736e;line-height:1.6}.status{margin-top:18px;color:#6d7b73}</style></head><body><h1>Pasangkan Zapzap</h1><p class="help">Login di PWA Zapzap, buka Devices → Pair new, lalu masukkan code enam digit di bawah.</p><label>Alamat Zapzap<input id="origin" placeholder="https://zapzap.example.com"/></label><label>Pairing code<input id="code" inputmode="numeric" maxlength="6" placeholder="123456"/></label><label>Nama device<input id="name" value="Chrome Extension"/></label><button id="save">Pair device</button><p id="status" class="status"></p><script src="options.js"></script></body></html>
